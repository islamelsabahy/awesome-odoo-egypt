name: Link check

# Runs monthly and on demand, not on every push, so a third-party site being
# down never blocks a contribution.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --timeout 20 "README.md" "docs/*.md"
          fail: true
